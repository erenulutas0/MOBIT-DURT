spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  # Real Postgres via Testcontainers (the jdbc:tc: URL auto-starts and shares a container for
  # the JVM). Flyway builds the schema from V1..Vn and Hibernate validates the entity mappings
  # against it, so the whole @ActiveProfiles("postgres") suite exercises the actual migrations
  # and Postgres-only features (native FTS) instead of an H2 stand-in.
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///docsbot?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
docsbot:
  data-dir: target/test-data
  vault-dir: target/test-vault
  deadline-initial-delay-ms: 3600000
