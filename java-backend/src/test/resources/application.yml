spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

docsbot:
  rate-limit:
    # Off for tests. Production limits are per client address, and the whole suite is one address
    # inside one JVM — so a few hundred logins across unrelated tests drain a budget meant for one
    # user's minute, and whichever test happens to run last fails with 429. That failure says
    # nothing about the code under test, and chasing it teaches people to re-run the build.
    enabled: false
  registration:
    # Registration auto-approves, so production keeps it shut unless a code is configured. The
    # tests need it open to exercise the flow at all, and one shared value keeps every registering
    # test honest about sending it.
    join-code: test-join-code
  data-dir: ../data
  vault-dir: ../vault
  max-file-size-bytes: 26214400
  phone-hash-salt: test-phone-hash-salt
  telegram:
    enabled: false
    token:
    api-base-url: http://127.0.0.1
    poll-timeout-seconds: 1
    poll-delay-ms: 1000
    allowed-chat-ids:
    admin-user-ids:
    mode: polling
    webhook-url:
    webhook-secret:
  admin:
    username: admin
    password: admin123
    display-name: Admin
  jwt:
    issuer: docsbot-ops-test
    secret: test-secret-that-is-at-least-32-bytes-long
    access-token-minutes: 15
