name: Off-site DB Backup

# Pulls an encrypted PostgreSQL dump off the VPS and stores it as a retained GitHub artifact —
# off-site from the server, so a VPS loss/compromise doesn't take the backups with it. The dump is
# gpg-symmetric-encrypted with the BACKUP_PASSPHRASE secret, so the artifact is useless without it.
on:
  schedule:
    - cron: "30 3 * * *" # daily 03:30 UTC, ~1h after the VPS's own 02:30 cron backup
  workflow_dispatch:

jobs:
  backup:
    name: Dump, encrypt, upload
    runs-on: ubuntu-latest
    # Only the private repo should ever hold production data; skip on any public mirror.
    if: github.repository == 'erenulutas0/MOBIT-DURT'
    env:
      DEPLOY_HOST: 84.46.251.95
      DEPLOY_USER: root
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Dump database over SSH
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'docker exec docsbot-postgres pg_dump -U docsbot docsbot | gzip -c' > db.sql.gz
          SIZE=$(stat -c%s db.sql.gz)
          echo "Dump size: ${SIZE} bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "Dump is suspiciously small (<1KB) — treating as failure."
            exit 1
          fi

      - name: Archive uploaded files over SSH
        run: |
          set -euo pipefail
          # The DB alone is not enough: tender documents, workspace files and message media live on
          # disk. Tar every candidate data dir that exists so a VPS loss can't erase the archive.
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" '
            set -e
            DIRS=""
            for d in /opt/docsbot/data /opt/docsbot/uploads /opt/docsbot/vault; do
              [ -d "$d" ] && DIRS="$DIRS $d"
            done
            if [ -z "$DIRS" ]; then
              echo "NO_DATA_DIRS" >&2
              exit 42
            fi
            tar -czf - $DIRS
          ' > files.tar.gz || {
            if [ "$?" = "42" ]; then
              echo "::warning::No data directories found on the VPS — files backup skipped."
              rm -f files.tar.gz
            else
              exit 1
            fi
          }
          if [ -f files.tar.gz ]; then
            echo "Files archive size: $(stat -c%s files.tar.gz) bytes"
          fi

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "BACKUP_PASSPHRASE secret is not set — refusing to store an unencrypted dump."
            exit 1
          fi
          STAMP=$(date -u +%Y%m%d-%H%M)
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "${BACKUP_PASSPHRASE}" \
            -o "docsbot-db-${STAMP}.sql.gz.gpg" db.sql.gz
          if [ -f files.tar.gz ]; then
            gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "${BACKUP_PASSPHRASE}" \
              -o "docsbot-files-${STAMP}.tar.gz.gpg" files.tar.gz
          fi
          echo "ARTIFACT_NAME=docsbot-backup-${STAMP}" >> "$GITHUB_ENV"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: "*.gpg"
          retention-days: 90

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
