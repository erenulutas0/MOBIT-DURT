name: CI Failure Alert

# Whenever a quality gate, deploy, or mobile build finishes red, open (or update) a GitHub issue so
# failures are impossible to miss — same alerting pattern as the uptime monitor.
#
# And close it when the same workflow next finishes green. Without that half, the light only ever
# turns on: five alerts sat open here for a fortnight, every one of them fixed long before, which
# is how an alarm teaches people to stop looking at it. A red issue has to mean "broken now".
on:
  workflow_run:
    workflows:
      - "Backend Quality Gate"
      - "Mobile Quality Gate"
      - "Web Quality Gate"
      - "Deploy Backend to VPS"
      - "Build Mobile AAB/APK"
      - "Off-site DB Backup"
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    name: Open issue on failure
    runs-on: ubuntu-latest
    if: github.repository == 'erenulutas0/MOBIT-DURT' && github.event.workflow_run.conclusion == 'failure'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ALERT_LABEL: ci-alert
    steps:
      - name: Create or update alert issue
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          NAME="${{ github.event.workflow_run.name }}"
          URL="${{ github.event.workflow_run.html_url }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          gh label create "$ALERT_LABEL" --repo "$REPO" --color D93F0B --description "Automated CI failure alert" 2>/dev/null || true
          export TITLE="🔴 CI hatası: $NAME"
          # Matched on the exact title rather than through GitHub's search. Search does put the
          # right issue first today, but these titles share words — "Deploy Backend to VPS" and
          # "Backend Quality Gate" — and ranking is not a promise anybody made us.
          EXISTING=$(gh issue list --repo "$REPO" --label "$ALERT_LABEL" --state open \
                       --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          BODY="**$NAME** başarısız oldu ($(date -u '+%Y-%m-%d %H:%M UTC')).
          Branch: \`$BRANCH\` · Commit: \`${SHA:0:8}\`
          Log: $URL"
          if [ -z "$EXISTING" ]; then
            gh issue create --repo "$REPO" --title "$TITLE" --label "$ALERT_LABEL" --body "$BODY"
          else
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          fi

  recover:
    name: Close alert on recovery
    runs-on: ubuntu-latest
    if: github.repository == 'erenulutas0/MOBIT-DURT' && github.event.workflow_run.conclusion == 'success'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ALERT_LABEL: ci-alert
    steps:
      - name: Close the alert this workflow opened
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          NAME="${{ github.event.workflow_run.name }}"
          URL="${{ github.event.workflow_run.html_url }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          export TITLE="🔴 CI hatası: $NAME"
          # Only this workflow's own alert, matched on the exact title. A green backend build says
          # nothing about the nightly backup, and closing is the direction where a near-miss costs
          # something: it would take a red light off a thing that is still broken.
          OPEN=$(gh issue list --repo "$REPO" --label "$ALERT_LABEL" --state open \
                   --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -z "$OPEN" ]; then
            echo "Açık alarm yok, kapatılacak bir şey de yok."
            exit 0
          fi
          gh issue close "$OPEN" --repo "$REPO" --reason completed --comment \
            "✅ **$NAME** yeniden başarılı ($(date -u '+%Y-%m-%d %H:%M UTC')).
          Commit: \`${SHA:0:8}\` · Log: $URL"
