name: Uptime Monitor

# Polls the production /health endpoint. On sustained failure it opens (or comments on) a GitHub
# issue so the team gets notified; when the service recovers it comments and closes the issue.
on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch:

permissions:
  issues: write

jobs:
  probe:
    name: Probe /health
    runs-on: ubuntu-latest
    if: github.repository == 'erenulutas0/MOBIT-DURT'
    env:
      HEALTH_URL: https://84-46-251-95.sslip.io/health
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ALERT_LABEL: uptime-alert
    steps:
      - name: Check endpoints (3 tries each)
        id: check
        run: |
          BASE="https://84-46-251-95.sslip.io"
          # url|expected_code|label — 401s prove the route reaches the backend (auth wall), which
          # also guards against the Caddy misroute class of failure (SPA fallback returns 200 html).
          CHECKS=$(cat <<LIST
          $BASE/health|200|backend-health
          $BASE/|200|web-panel
          $BASE/api/erp/auth/admin-login|405|api-route
          $BASE/document-groups|401|alanlar-route
          $BASE/erp/assistant/speech|401|speech-route
          LIST
          )
          ok=1
          failures=""
          while IFS='|' read -r url expected label; do
            # The heredoc keeps YAML indentation — strip it off every field.
            url=$(echo $url | xargs); expected=$(echo $expected | xargs); label=$(echo $label | xargs)
            [ -z "$url" ] && continue
            got=""
            for i in 1 2 3; do
              got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo 000)
              [ "$got" = "$expected" ] && break
              sleep 8
            done
            echo "$label: got $got (expected $expected)"
            if [ "$got" != "$expected" ]; then
              ok=0
              failures="$failures $label=$got(exp:$expected)"
            fi
          done <<< "$CHECKS"
          echo "healthy=$ok" >> "$GITHUB_OUTPUT"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"

      - name: Open/close alert issue
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          # Ensure the label exists (ignore error if it already does).
          gh label create "$ALERT_LABEL" --repo "$REPO" --color B60205 --description "Automated uptime alert" 2>/dev/null || true
          EXISTING=$(gh issue list --repo "$REPO" --label "$ALERT_LABEL" --state open --json number --jq '.[0].number' || echo "")

          if [ "${{ steps.check.outputs.healthy }}" != "1" ]; then
            DETAIL="${{ steps.check.outputs.failures }}"
            if [ -z "$EXISTING" ]; then
              gh issue create --repo "$REPO" \
                --title "🔴 Servis kontrolü başarısız (uptime)" \
                --label "$ALERT_LABEL" \
                --body "Otomatik izleme şu kontrollerde hata gördü:$DETAIL ($(date -u '+%Y-%m-%d %H:%M UTC')). Sunucu/Caddy/deploy durumunu kontrol edin."
            else
              gh issue comment "$EXISTING" --repo "$REPO" \
                --body "Hâlâ sorunlu:$DETAIL ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            fi
          else
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$REPO" \
                --body "✅ Servis tekrar erişilebilir ($(date -u '+%Y-%m-%d %H:%M UTC')). Kapatılıyor."
              gh issue close "$EXISTING" --repo "$REPO"
            fi
            echo "Healthy."
          fi
