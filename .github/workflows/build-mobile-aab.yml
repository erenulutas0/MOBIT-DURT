name: Build Mobile AAB/APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (leave as default unless overriding)"
        required: false
        default: "1.0.25"
      version_code:
        description: "versionCode (integer, higher than last Play upload)"
        required: false
        default: "25"

jobs:
  build:
    name: Test, Build Signed Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: mobile_frontend/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Run tests + typecheck
        run: |
          npm test
          npm run typecheck

      - name: Build production web assets
        env:
          # Stamps the in-app version so the update banner matches the release.
          VITE_APP_VERSION: ${{ inputs.version_name }}
        run: npx vite build --mode production

      - name: Sync into Android project
        run: npx cap sync android

      - name: Decode signing keystore
        # Values are read from env (not interpolated into the script text), so a password
        # containing $ or backticks cannot break the file or leak via shell expansion.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/docsbot-upload-key.jks
          {
            echo "storeFile=../docsbot-upload-key.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build signed AAB + APK
        working-directory: mobile_frontend/android
        # Values come from env (not interpolated into the script) and are trimmed + quoted, so a
        # stray space in an input can't split the Gradle arg into a bogus task name.
        env:
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
          VERSION_NAME_INPUT: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          VERSION_CODE="$(echo "$VERSION_CODE_INPUT" | tr -d '[:space:]')"
          VERSION_NAME="$(echo "$VERSION_NAME_INPUT" | xargs)"
          ./gradlew bundleRelease assembleRelease \
            "-PversionCodeOverride=${VERSION_CODE}" \
            "-PversionNameOverride=${VERSION_NAME}"

      - name: Report version
        run: echo "Built versionName=${{ inputs.version_name }} versionCode=${{ inputs.version_code }}"

      - name: Clean up signing material
        if: always()
        # Paths are relative to the job's default working-directory (mobile_frontend).
        run: rm -f android/docsbot-upload-key.jks android/keystore.properties

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: mobile_frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile_frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
