name: Mobile Quality Gate

on:
  push:
    branches: ["main"]
    paths:
      - "mobile_frontend/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "mobile_frontend/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  mobile:
    name: Test, Typecheck, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: mobile_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
