name: Deploy Backend to VPS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you want to deploy to production'
        required: true

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy'
    name: Test, Build, Deploy
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 84.46.251.95
      DEPLOY_USER: root
      REMOTE_APP_DIR: /opt/docsbot/app
      REMOTE_JAR: /opt/docsbot/app/docsbot-ops-backend.jar
      REMOTE_STAGED_JAR: /opt/docsbot/app/docsbot-ops-backend.jar.new

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend test suite
        working-directory: java-backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test

      - name: Build JAR
        working-directory: java-backend
        run: ./mvnw -B -ntp -DskipTests package

      # The web panel is deployed by this job too. It was not, and nobody noticed for four weeks:
      # the copy on the server dated from 15 July while the repository moved on, so features that
      # had been written, reviewed and merged were simply not there. Building it here costs a few
      # seconds and removes the chance of that happening again quietly.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web panel
        working-directory: frontend
        run: |
          npm ci
          npm run build
          tar czf ../frontend-dist.tgz -C dist .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Locate built JAR
        id: jar
        working-directory: java-backend
        run: |
          JAR_PATH=$(ls target/*.jar | grep -v original | head -1)
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          sha256sum "$JAR_PATH"

      - name: Pre-deploy backups (jar, .env, database)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} '
            set -euo pipefail
            TS=$(date +%Y%m%d%H%M)
            cd /opt/docsbot
            cp app/docsbot-ops-backend.jar backups/docsbot-ops-backend-${TS}-predeploy.jar
            cp .env backups/env.${TS}-predeploy.bak
            docker exec docsbot-postgres pg_dump -U docsbot docsbot > backups/docsbot-postgres.${TS}-predeploy.sql
            echo "$TS" > /tmp/deploy_backup_ts
          '

      - name: Upload new JAR
        run: |
          scp -i ~/.ssh/deploy_key "java-backend/${{ steps.jar.outputs.path }}" \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.REMOTE_STAGED_JAR }}

      # Extracted over the directory rather than swapping it: that path is bind-mounted into Caddy,
      # so replacing the directory would leave the container holding the old inode and serving the
      # previous panel forever. Old assets are cleared first — the bundle names are hashed, so
      # without that every deploy leaves its predecessor behind.
      - name: Publish web panel
        run: |
          scp -i ~/.ssh/deploy_key frontend-dist.tgz ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/tmp/frontend-dist.tgz
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} '
            set -euo pipefail
            rm -rf /srv/docsbot/frontend/assets
            tar xzf /tmp/frontend-dist.tgz -C /srv/docsbot/frontend
            rm -f /tmp/frontend-dist.tgz
            ls -1 /srv/docsbot/frontend
          '

      # The sidecar's build context lived only on the server and drifted from the repo: its
      # Dockerfile was changed and committed, the image was rebuilt on the box, and the rebuild
      # silently used the old file — it succeeded and shipped nothing. Syncing keeps the two equal.
      - name: Sync sidecar sources
        run: |
          scp -i ~/.ssh/deploy_key embedding-service/Dockerfile embedding-service/app.py embedding-service/bulletin.py ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/opt/docsbot/embedding-service/

      # Rebuilt here rather than left to somebody to remember. It used to be a manual step on the
      # grounds that a rebuild "takes minutes and downloads a model" — but the model and the wheels
      # are earlier layers and stay cached; only the COPY at the end is invalidated, which takes
      # about a second. What the manual step actually cost was correctness: it failed twice in one
      # day, both times the same way. The rebuild has to run AFTER the sync, and when somebody runs
      # it before, Docker finds nothing new to copy, reports CACHED, leaves the old container
      # running and looks exactly like success. A parser fix and an event-loop fix each sat
      # undeployed behind that.
      - name: Rebuild the sidecar so the sources just synced are the ones running
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} "
            set -euo pipefail
            cd /opt/docsbot
            docker compose --profile rag up -d --build docsbot-embeddings
            # Proof rather than trust: the file inside the running container must match the one
            # just uploaded. This is the check that would have caught both of today's misses.
            HOST_SHA=\$(sha256sum /opt/docsbot/embedding-service/app.py | awk '{print \$1}')
            RUN_SHA=\$(docker exec docsbot-embeddings sha256sum /app/app.py | awk '{print \$1}')
            if [ \"\$HOST_SHA\" != \"\$RUN_SHA\" ]; then
              echo 'Sidecar is still running an older app.py than the one deployed.'
              exit 1
            fi
            echo 'sidecar rebuilt and verified'
          "

      - name: Verify checksum, swap JAR, recreate container
        run: |
          LOCAL_SHA=$(sha256sum "java-backend/${{ steps.jar.outputs.path }}" | awk '{print $1}')
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} "
            set -euo pipefail
            REMOTE_SHA=\$(sha256sum ${{ env.REMOTE_STAGED_JAR }} | awk '{print \$1}')
            if [ \"\$REMOTE_SHA\" != \"$LOCAL_SHA\" ]; then
              echo 'Checksum mismatch after upload — aborting before touching the live jar.'
              exit 1
            fi
            mv ${{ env.REMOTE_STAGED_JAR }} ${{ env.REMOTE_JAR }}
            cd /opt/docsbot
            # --force-recreate is required: the jar is a read-only bind mount, so a plain
            # 'up -d' sees no config change and would NOT restart the container, leaving the
            # old jar running in the JVM. Force-recreate re-execs the process on the new jar
            # (and also picks up any .env change).
            docker compose up -d --force-recreate docsbot-backend
          "

      - name: Wait for health check
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 https://84-46-251-95.sslip.io/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend healthy after ${i} attempts."
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Backend did not become healthy in time."
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          BACKUP_TS=$(ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} 'cat /tmp/deploy_backup_ts' || echo "")
          if [ -z "$BACKUP_TS" ]; then
            echo "No backup timestamp recorded — nothing to roll back automatically. Investigate manually."
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} "
            set -euo pipefail
            cd /opt/docsbot
            cp backups/docsbot-ops-backend-${BACKUP_TS}-predeploy.jar app/docsbot-ops-backend.jar
            docker compose up -d --force-recreate docsbot-backend
            echo 'Rolled back to pre-deploy jar (backup ${BACKUP_TS}). Database changes (if any migrations ran) are NOT auto-reverted — check Flyway state manually.'
          "

      # Deliberately after the rollback step, and the ordering is load-bearing. Every customer
      # backend bind-mounts the same jar, so after a deploy they are all *serving* the old one
      # until they restart — the demo tenant sat four schema versions behind for a week that way,
      # and would have applied those migrations at whatever random moment it next restarted.
      #
      # Placed here so a customer failing to come back up cannot roll production back: production
      # was verified healthy two steps ago, and reverting it because customer three broke would
      # turn one tenant's problem into everybody's. The job still fails, loudly.
      - name: Update tenant backends
        run: |
          # Copied from the repo every time rather than trusting the copy on the box. The sidecar
          # taught this lesson already: a script that lives only on the server drifts from the one
          # in version control, and the drift is invisible until it matters.
          scp -i ~/.ssh/deploy_key scripts/update-tenants.sh \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/opt/docsbot/update-tenants.sh
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            'chmod +x /opt/docsbot/update-tenants.sh && /opt/docsbot/update-tenants.sh'

      # Cron runs /opt/docsbot/scripts/backup.sh nightly, and nothing was keeping that copy in step
      # with the repo — which is how it went on backing up one database and two directories long
      # after provision-tenant.sh started giving every customer their own. Same lesson as the
      # sidecar and update-tenants.sh: a script that lives only on the server drifts, and the drift
      # is invisible until the night you need the backup.
      - name: Update the backup script
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            'mkdir -p /opt/docsbot/scripts'
          scp -i ~/.ssh/deploy_key scripts/backup.sh \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/opt/docsbot/scripts/backup.sh
          ssh -i ~/.ssh/deploy_key ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            'chmod +x /opt/docsbot/scripts/backup.sh && bash -n /opt/docsbot/scripts/backup.sh'

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
