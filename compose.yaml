services:
  postgres:
    image: postgres:17-alpine
    container_name: docsbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docsbot
      POSTGRES_USER: docsbot
      POSTGRES_PASSWORD: docsbot-local
    ports:
      # Host port is overridable because this machine runs several PostgreSQL
      # instances; pair any override with SPRING_DATASOURCE_URL for the backend.
      - "127.0.0.1:${DOCSBOT_PG_PORT:-5433}:5432"
    volumes:
      - docsbot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsbot -d docsbot"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Self-hosted embeddings for the document assistant. Sits beside Piper on the internal network;
  # nothing about it is reachable from the internet, and no document text leaves the host.
  #
  # Not started by a plain `docker compose up` — the image bakes in ~1GB of model weights, which
  # nobody wants to build just to run the backend. Bring it up explicitly:
  #     docker compose --profile rag up -d --build docsbot-embeddings
  #
  # Changing the model invalidates every stored vector, so deploy the backend first and rebuild this
  # second: the backend re-indexes on a model change, and re-indexing under the old backend would
  # store passages the new one then considers already done.
  docsbot-embeddings:
    build: ./embedding-service
    container_name: docsbot-embeddings
    restart: unless-stopped
    profiles: ["rag"]
    environment:
      # Must match the model baked into the image, or the container downloads a second one at
      # startup and the first request waits on it.
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
    ports:
      # Loopback only: the backend reaches it by container name in production.
      - "127.0.0.1:${DOCSBOT_EMBEDDINGS_PORT:-5001}:5001"
    # Indexing is background work and must never starve the backend or Piper of CPU.
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  docsbot_postgres_data:
